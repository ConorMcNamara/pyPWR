name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting with ruff
        run: |
          uv run ruff format --check .

      - name: Lint with ruff
        run: |
          uv run ruff check --output-format=github .

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install package and dependencies
        run: uv sync

      - name: Type check with zuban
        run: |
          uv run zuban check PyPWR
        continue-on-error: true

  setup:
    name: Determine Python versions
    runs-on: ubuntu-latest
    outputs:
      python-versions: ${{ steps.versions.outputs.list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Derive Python versions from pyproject.toml classifiers
        id: versions
        run: |
          list=$(python - <<'PY'
          import json, re, tomllib
          with open("pyproject.toml", "rb") as f:
              classifiers = tomllib.load(f)["project"]["classifiers"]
          pat = re.compile(r"Programming Language :: Python :: (\d+\.\d+)$")
          vs = [m.group(1) for c in classifiers if (m := pat.search(c))]
          vs.sort(key=lambda v: tuple(map(int, v.split("."))))
          print(json.dumps(vs))
          PY
          )
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "Testing against: $list"

  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(needs.setup.outputs.python-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install package and dependencies
        run: uv sync --python ${{ matrix.python-version }}
        shell: bash

      - name: Run tests with coverage
        run: |
          uv run pytest test/ -v
        shell: bash

      - name: Upload coverage reports to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == fromJSON(needs.setup.outputs.python-versions)[0]
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  auto-format:
    name: Auto-format Code
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [lint, type-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install package with dev dependencies
        run: uv sync

      - name: Auto-format with ruff
        run: |
          uv run ruff format .
          uv run ruff check --fix --unsafe-fixes .

      - name: Auto-format with autopep8
        run: |
          uv run autopep8 --in-place --aggressive --max-line-length 120 --recursive PyPWR/ test/

      - name: Format docstrings
        run: |
          find PyPWR test -name "*.py" -exec uv run pydocstringformatter -w --style numpydoc --numpydoc-section-order --numpydoc-name-type-spacing --numpydoc-section-spacing --numpydoc-section-hyphen-length --no-final-period {} +
        continue-on-error: true

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "Auto-format code with ruff, autopep8 and pydocstringformatter [skip ci]"
            git push
          else
            echo "No formatting changes needed"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
